*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}

.social a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;box-shadow:0 4px 0 rgba(27,42,74,.15)}

main{max-width:560px;margin:0 auto;padding:22px max(4vw,14px) 40px}
.tools{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:12px}
.search{width:100%;min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 16px "Noto Sans TC",sans-serif;padding:0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 15px "Noto Sans TC",sans-serif;cursor:pointer}
.tabs button small{font-weight:500;opacity:.75;margin-left:4px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--price);outline-offset:2px}
.count{color:var(--soft);font-size:14px;margin:4px 2px 14px}
.list{display:grid;gap:14px}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 6px 0 var(--line);display:grid;gap:12px}
.open{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start;border-radius:14px}
.open:focus-visible{outline:3px solid var(--price);outline-offset:3px}
.thumb{width:104px;height:104px;border-radius:14px;object-fit:cover;background:var(--chip);display:block}
.ph{width:104px;height:104px;border-radius:14px;background:var(--chip);display:grid;place-items:center}
.ph svg{width:48px;height:48px;color:var(--ink);opacity:.7}
.info{display:grid;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cat{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--chip)}
.isnew{font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--new);color:#fff}
.name{font-size:17px;line-height:1.35;font-weight:900;margin:0}
.fit{margin:0;color:var(--soft);font-size:14px}
.more{font-size:13px;font-weight:700;color:var(--price)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-size:28px;font-weight:900;color:var(--price);line-height:1;white-space:nowrap}
.price small{font-size:.5em;margin-left:2px}
.sold{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;background:var(--gold);color:#1b2a4a;padding:2px 9px;border-radius:999px;vertical-align:middle}
.go{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--btn);color:var(--btnink);text-decoration:none;font-weight:900;font-size:15px;white-space:nowrap}
.go svg{width:18px;height:18px}
.empty{text-align:center;color:var(--soft);padding:30px 0}
.note{margin-top:28px;padding:16px 18px;border-radius:16px;border:2px dashed var(--line);font-size:14px;color:var(--soft)}
.note b{color:var(--ink)}
footer{text-align:center;font-size:13px;color:var(--soft);padding:0 16px 32px}
dialog{border:0;padding:0;border-radius:24px;width:min(92vw,460px);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,30,40,.55)}
.dimg{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--chip)}
.dph{width:100%;aspect-ratio:16/9;display:grid;place-items:center;background:var(--chip)}
.dph svg{width:72px;height:72px;opacity:.7}
.dbody{padding:18px 20px 22px;display:grid;gap:10px}
.dbody h2{margin:0;font-size:21px;line-height:1.3;font-weight:900}
.dbody p{margin:0}
.dbody ul{margin:0;padding-left:20px;display:grid;gap:4px}
.dmin{font-weight:700}
.close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1b2a4a;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dwrap{position:relative;overflow:auto;max-height:90vh}
@media (prefers-reduced-motion:no-preference){.mascot{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}}
</style>
</head>
